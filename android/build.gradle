buildscript {
    ext.kotlin_version = '1.9.10'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

group 'com.resideo.flutter_audio_streaming'
version '1.0-SNAPSHOT'

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url "${project(':flutter_audio_streaming').projectDir}/repo" }
    }
}

android {
    compileSdkVersion 36
    namespace "com.resideo.flutter_audio_streaming"

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 28
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    //implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation('com.github.pedroSG94.rtmp-rtsp-stream-client-java:rtplibrary:2.0.7') {
        // Exclude the rtsp module that contains the broken TLSSocketFactory
        // (hardcodes TLSv1.1 which is unsupported on Android API 33+).
        // A patched rtsp AAR (with TLSSocketFactory/CreateSSLSocket stripped)
        // is served from the local Maven repo in android/repo/, and fixed
        // source replacements live in src/main/kotlin/com/pedro/rtsp/utils/.
        exclude module: 'rtsp'
    }
    implementation 'com.pedro.rtsp:rtsp-patched:2.0.7'
    implementation "androidx.core:core-ktx:1.3.2"


    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.0") {
            because("kotlin-stdlib-jdk7 is now a part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.0") {
            because("kotlin-stdlib-jdk8 is now a part of kotlin-stdlib")
        }
    }

    //Development
//    implementation files('/Users/lqm/development/flutter/bin/cache/artifacts/engine/android-x64/flutter.jar')
}
